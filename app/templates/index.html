<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101014">
    <title>Crimson Tasks</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='logo2.png') }}?v=1">
    <script src="{{ url_for('static', path='theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=glyph-centered-strike-6">
    <script defer src="{{ url_for('static', path='task-timing.js') }}?v=importance-50-medium"></script>
    <script defer src="{{ url_for('static', path='datetime-picker.js') }}"></script>
    <script defer src="{{ url_for('static', path='app.js') }}?v=filters-4"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img class="brand-logo" src="{{ url_for('static', path='logo.png') }}"
                alt="Crimson Tasks" width="2169" height="725">
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-symbol" aria-hidden="true">☀</span>
            <span id="theme-label">Светлая тема</span>
        </button>
    </header>

    <main class="workspace">
        <header class="dashboard-header">
            <div>
                <h1>Мои задачи</h1>
                <p class="subtitle">Планируй, выполняй, контролируй</p>
            </div>
            <dl class="summary" aria-label="Сводка по задачам">
                <div class="stat">
                    <dt><span class="icon icon-calendar" aria-hidden="true"></span>Всего</dt>
                    <dd data-count="all">—</dd>
                </div>
                <div class="stat">
                    <dt><span class="icon icon-clock" aria-hidden="true"></span>Активных</dt>
                    <dd data-count="active">—</dd>
                </div>
                <div class="stat">
                    <dt><span class="icon icon-done" aria-hidden="true"></span>Выполненных</dt>
                    <dd data-count="completed">—</dd>
                </div>
                <div class="stat">
                    <dt><span class="icon icon-cross" aria-hidden="true"></span>Невыполненных</dt>
                    <dd data-count="uncompleted">—</dd>
                </div>
            </dl>
        </header>

        <form class="task-form" id="task-form" novalidate>
            <div class="task-field">
                <label for="task-title" class="visually-hidden">Название новой задачи</label>
                <span class="icon icon-pencil" aria-hidden="true"></span>
                <input id="task-title" name="title" type="text" required autocomplete="off"
                    placeholder="Добавить новую задачу…" aria-describedby="title-error">
            </div>
            <button class="add-button" type="submit" disabled>
                <span class="icon icon-plus" aria-hidden="true"></span>
                Добавить
            </button>
            <p class="form-error" id="title-error" role="alert" hidden></p>
        </form>

        <nav class="filters" aria-label="Фильтры задач">
            <button type="button" class="filter" data-filter="all" aria-pressed="true">
                <span class="icon icon-grid" aria-hidden="true"><span></span><span></span></span>
                <span>Все задачи</span>
                <span class="filter-count" data-count="all">—</span>
            </button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">
                <span class="icon icon-clock" aria-hidden="true"></span>
                <span>Активные</span>
                <span class="filter-count" data-count="active">—</span>
            </button>
            <button type="button" class="filter" data-filter="completed" aria-pressed="false">
                <span class="icon icon-done" aria-hidden="true"></span>
                <span>Выполненные</span>
                <span class="filter-count" data-count="completed">—</span>
            </button>
            <button type="button" class="filter" data-filter="uncompleted" aria-pressed="false">
                <span class="icon icon-cross" aria-hidden="true"></span>
                <span>Невыполненные</span>
                <span class="filter-count" data-count="uncompleted">—</span>
            </button>
        </nav>

        <noscript><p>Для работы со списком задач включите JavaScript.</p></noscript>

        <section class="tasks" aria-label="Список задач">
            <p class="action-message" id="action-message" role="status"></p>
            <div class="list-state" id="list-state" hidden>
                <p id="list-message" role="status">Загружаем задачи…</p>
                <button class="retry-button" id="retry-button" type="button" hidden>Повторить</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </section>

        <template id="task-template">
            <li class="task-card">
                <div class="task-info">
                    <input class="task-checkbox" type="checkbox">
                    <div class="task-content">
                        <span class="task-name"></span>
                        <div class="task-dates"></div>
                        <div class="task-indicators">
                            <span class="urgency-label"></span>
                            <span class="importance-label"></span>
                        </div>
                        <div class="time-budget" hidden>
                            <span class="time-caption"></span>
                            <progress class="time-progress" max="100" aria-label="Израсходовано времени"></progress>
                        </div>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="task-action edit-button" type="button">
                        <span class="icon icon-pencil" aria-hidden="true"></span>
                    </button>
                    <button class="task-action delete-button" type="button">
                        <span class="icon icon-trash" aria-hidden="true"></span>
                    </button>
                </div>
            </li>
        </template>

        <dialog class="task-dialog task-editor" id="create-dialog" aria-labelledby="create-heading">
            <form id="create-form" novalidate>
                <div class="editor-body">
                <h2 id="create-heading">Новая задача</h2>
                <label for="create-title">Название задачи</label>
                <input id="create-title" type="text" autocomplete="off" autofocus aria-describedby="create-error">
                <p class="form-error" id="create-error" role="alert" hidden></p>
                <div class="datetime-picker" id="create-picker"></div>
                <p class="form-error" id="create-due-error" role="alert" hidden></p>
                <label for="create-importance">Важность задачи <output id="create-importance-value"></output></label>
                <input id="create-importance" type="range" min="0" max="100" step="5" value="50">
                <p class="action-message" id="create-message" role="status"></p>
                </div>
                <div class="dialog-actions">
                    <button class="dialog-button" id="create-cancel" type="button">Отмена</button>
                    <button class="dialog-button dialog-primary" id="create-save" type="submit">Создать задачу</button>
                </div>
            </form>
        </dialog>

        <dialog class="task-dialog task-editor" id="edit-dialog" aria-labelledby="edit-heading">
            <form id="edit-form" novalidate>
                <div class="editor-body">
                <h2 id="edit-heading">Изменить задачу</h2>
                <label for="edit-title" class="visually-hidden">Название задачи</label>
                <input id="edit-title" type="text" required autocomplete="off" autofocus
                    aria-describedby="edit-error">
                <p class="form-error" id="edit-error" role="alert" hidden></p>
                <div class="datetime-picker" id="edit-picker"></div>
                <p class="form-error" id="edit-due-error" role="alert" hidden></p>
                <label for="edit-importance">Важность задачи <output id="edit-importance-value"></output></label>
                <input id="edit-importance" type="range" min="0" max="100" step="5" value="50">
                <p class="action-message" id="edit-message" role="status"></p>
                </div>
                <div class="dialog-actions">
                    <button class="dialog-button" id="edit-cancel" type="button">Отмена</button>
                    <button class="dialog-button dialog-primary" id="edit-save" type="submit">Сохранить</button>
                </div>
            </form>
        </dialog>

        <dialog class="task-dialog" id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-name">
            <form method="dialog">
                <h2 id="delete-heading">Вы уверены, что хотите удалить задачу?</h2>
                <p class="dialog-description" id="delete-name"></p>
                <div class="dialog-actions">
                    <button class="dialog-button" value="cancel" autofocus>Отмена</button>
                    <button class="dialog-button dialog-primary" value="delete">Удалить</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
