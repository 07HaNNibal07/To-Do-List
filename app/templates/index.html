<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101014">
    <title>Crimson Tasks</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Crimson <strong>Tasks</strong></span>
        </div>

        <nav class="filters" aria-label="Фильтры задач">
            <button type="button" class="filter" data-filter="all" aria-pressed="true">
                <span class="icon icon-grid" aria-hidden="true"><span></span><span></span></span>
                <span>Все задачи</span>
                <span class="filter-count" data-count="all">—</span>
            </button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">
                <span class="icon icon-clock" aria-hidden="true"></span>
                <span>Активные</span>
                <span class="filter-count" data-count="active">—</span>
            </button>
            <button type="button" class="filter" data-filter="completed" aria-pressed="false">
                <span class="icon icon-done" aria-hidden="true"></span>
                <span>Выполненные</span>
                <span class="filter-count" data-count="completed">—</span>
            </button>
        </nav>
    </aside>

    <main class="workspace">
        <header class="dashboard-header">
            <div>
                <h1>Мои задачи</h1>
                <p class="subtitle">Планируй, выполняй, контролируй</p>
            </div>
            <dl class="summary" aria-label="Сводка по задачам">
                <div class="stat">
                    <dt><span class="icon icon-calendar" aria-hidden="true"></span>Всего</dt>
                    <dd data-count="all">—</dd>
                </div>
                <div class="stat">
                    <dt><span class="icon icon-clock" aria-hidden="true"></span>Активных</dt>
                    <dd data-count="active">—</dd>
                </div>
                <div class="stat">
                    <dt><span class="icon icon-done" aria-hidden="true"></span>Выполненных</dt>
                    <dd data-count="completed">—</dd>
                </div>
            </dl>
        </header>

        <form class="task-form" id="task-form" novalidate>
            <div class="task-field">
                <label for="task-title" class="visually-hidden">Название новой задачи</label>
                <span class="icon icon-pencil" aria-hidden="true"></span>
                <input id="task-title" name="title" type="text" required autocomplete="off"
                    placeholder="Добавить новую задачу…" aria-describedby="title-error">
            </div>
            <button class="add-button" type="submit" disabled>
                <span class="icon icon-plus" aria-hidden="true"></span>
                Добавить
            </button>
            <p class="form-error" id="title-error" role="alert" hidden></p>
        </form>

        <noscript><p>Для работы со списком задач включите JavaScript.</p></noscript>

        <section class="tasks" aria-label="Список задач">
            <p class="action-message" id="action-message" role="status"></p>
            <div class="list-state" id="list-state" hidden>
                <p id="list-message" role="status">Загружаем задачи…</p>
                <button class="retry-button" id="retry-button" type="button" hidden>Повторить</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </section>

        <template id="task-template">
            <li class="task-card">
                <label class="task-label">
                    <input class="task-checkbox" type="checkbox">
                    <span class="task-name"></span>
                </label>
                <button class="delete-button" type="button">
                    <span class="icon icon-trash" aria-hidden="true"></span>
                </button>
            </li>
        </template>
    </main>
</body>
</html>
